    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 30, 0.7);
            --primary-gold: #d4af37;
            --secondary-gold: #f0e68c;
            --accent-purple: #8a2be2;
            --accent-cyan: #00f2ff;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header { text-align: center; margin-bottom: 60px; }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 15px;
            background: linear-gradient(90deg, var(--primary-gold), var(--accent-cyan), var(--primary-gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 4px;
            animation: gradientFlow 5s linear infinite;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            flex: 1;
            min-width: 180px;
            max-width: 250px;
        }

        .stat h3 { font-family: 'Orbitron', sans-serif; font-size: 2em; color: var(--primary-gold); }

        .search-container {
            margin-bottom: 40px;
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container i {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--primary-gold);
        }

        .search-container input {
            padding: 15px 20px 15px 50px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 50px;
            width: 100%;
            background: rgba(15, 15, 25, 0.8);
            color: white;
            font-family: 'Roboto', sans-serif;
        }

        .categories-menu {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .category-btn {
            padding: 10px 18px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            background: rgba(212, 175, 55, 0.05);
            color: var(--primary-gold);
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .category-btn.active {
            background: var(--primary-gold);
            color: var(--bg-color);
        }

        .languages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .language-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: 0.4s;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
        }

        .language-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        .language-card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .language-icon { font-size: 2.5em; }
        .language-card h3 { font-family: 'Orbitron', sans-serif; color: var(--primary-gold); }
        .details-btn { margin-top: 10px; align-self: flex-start; border: 1px solid var(--primary-gold); border-radius: 20px; padding: 8px 14px; background: var(--secondary-gold); color: #17130a; cursor: pointer; font-weight: 700; }
        .details-btn:hover { background: white; }
        .details-link { display: inline-block; color: var(--secondary-gold); font-weight: 700; }

        .meta-tag {
            font-size: 0.7em;
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary-gold);
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); align-items: center; justify-content: center;
        }

        .modal-content {
            background: #0f0f1a; border: 1px solid var(--primary-gold); border-radius: 20px;
            width: 90%; max-width: 900px; height: 80vh; overflow: hidden; display: flex; flex-direction: column;
        }

        .modal-header { padding: 20px; border-bottom: 1px solid rgba(212,175,55,0.2); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; padding: 30px; overflow-y: auto; }

        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>

        <div class="search-container">

        function render(search = '') {
            const grid = document.getElementById('languagesGrid');
            grid.innerHTML = '';
            const query = search.trim().toLowerCase();
            const filtered = languagesData.filter(l => l.name.toLowerCase().includes(query));
            filtered.forEach(l => {
                const icon = languageIcons[l.name] || '💻';
                const card = document.createElement('article');
                card.className = 'language-card';
                card.innerHTML = `
                    <div class="language-card-header">
                        <div class="language-icon">${icon}</div>
                        <div>
                            <h3>${l.name}</h3>
                            <span class="meta-tag">${l.year || '—'}</span>
                        </div>
                    </div>
                    <p style="font-size: 0.8em; color: var(--text-dim);">${l.examples} exemplos · ${l.exercises} exercícios</p>
                    <button class="details-btn" type="button">Ver detalhes →</button>
                `;
                card.querySelector('.details-btn').onclick = (event) => { event.stopPropagation(); openModal(l); };
                card.onclick = () => openModal(l);
                grid.appendChild(card);
            });
        }
        function openModal(language) {
            const name = typeof language === 'string' ? language : language.name;
            const folder = typeof language === 'string' ? language : language.folder;
            const examples = typeof language === 'string' ? 0 : language.examples;
            const exercises = typeof language === 'string' ? 0 : language.exercises;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalBody').innerHTML = `
                <h3>Sobre ${name}</h3>
                <p>Explore os arquivos reais desta linguagem no acervo do Museu.</p>
                <p><strong>${examples}</strong> exemplos · <strong>${exercises}</strong> exercícios</p>
                <p><a class="details-link" href="https://github.com/gabrielaraujo-eng/projetos/tree/main/sites/museu-de-linguagens-do-mundo/linguagens/${encodeURIComponent(folder)}" target="_blank" rel="noopener">Abrir arquivos de ${name} no GitHub ↗</a></p>
            `;
            document.getElementById('languageModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('languageModal').style.display = 'none'; }
        document.getElementById('searchInput').oninput = (e) => render(e.target.value);

        // Fundo Animado
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const stars = Array.from({length: 100}, () => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2 }));
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#d4af37';
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
                s.y += 0.2; if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(animate);
        }

        render();
        animate();
    </script>
